project:
  type: website
  output-dir: _site

website:
  title: "ISSS626"
  site-url: "https://isss626-coursework.vercel.app"
  page-navigation: true
  back-to-top-navigation: false
  navbar:
    logo: false
    left:
      - href: index.qmd
        text: Home
      - href: coursework.qmd
        text: Hands-on
      - href: inclass.qmd
        text: In-class
      - href: takehome.qmd
        text: Take-home
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/jediasaf/isss626-coursework
        aria-label: GitHub repository
  sidebar:
    # Two sidebars, keyed by id. Quarto picks the one whose `contents` list the
    # page being rendered, so the hands-on pages and the take-home pages each get
    # their own navigation instead of sharing one long list.
    - id: handson
      title: "Hands-on"
      style: docked
      collapse-level: 1
      contents:
        - coursework.qmd
        - section: "Hands-on Exercise 1"
          contents:
            - text: "Part 01: Geospatial Data Wrangling"
              href: Hands-on_Ex/Hands-on_Ex01/Part01.qmd
            - text: "Part 02: Choropleth Mapping"
              href: Hands-on_Ex/Hands-on_Ex01/Part02.qmd
        - section: "Hands-on Exercise 2"
          contents:
            - text: "Part 01: First-order SPPA"
              href: Hands-on_Ex/Hands-on_Ex02/Part01.qmd
            - text: "Part 02: Second-order SPPA"
              href: Hands-on_Ex/Hands-on_Ex02/Part02.qmd
        - section: "Hands-on Exercise 3"
          contents:
            - text: "Network Constrained SPPA"
              href: Hands-on_Ex/Hands-on_Ex03/Hands-on_Ex03.qmd
        - section: "Hands-on Exercise 4"
          contents:
            - text: "Spatial Weights and Applications"
              href: Hands-on_Ex/Hands-on_Ex04/Hands-on_Ex04.qmd
        - section: "Hands-on Exercise 5"
          contents:
            - text: "Part 01: Global Measures"
              href: Hands-on_Ex/Hands-on_Ex05/Part01.qmd
            - text: "Part 02: Local Measures"
              href: Hands-on_Ex/Hands-on_Ex05/Part02.qmd
        - section: "Hands-on Exercise 6"
          contents:
            - text: "Geographical Segmentation"
              href: Hands-on_Ex/Hands-on_Ex06/Hands-on_Ex06.qmd
    - id: inclass
      title: "In-class"
      style: docked
      collapse-level: 1
      contents:
        - inclass.qmd
        - section: "In-class Exercise 5"
          contents:
            - text: "Emerging Hot Spot Analysis"
              href: In-class_Ex/In-class_Ex05/In-class_Ex05.qmd
    - id: takehome
      title: "Take-home"
      style: docked
      collapse-level: 1
      contents:
        - takehome.qmd
        - section: "Take-home Exercise 1"
          contents:
            - text: "Technical Report"
              href: Take-home_Ex/Take-home_Ex01/index.qmd
            - text: "Executive Summary"
              href: Take-home_Ex/Take-home_Ex01/slides.qmd
  page-footer:
    border: true
    left: |
      **ISSS626**  \
      Geospatial Analytics and Applications
    center: |
      By Jedidiah Asaf Tallulembang  \
      Singapore Management University
    right: |
      Coursework Portfolio · 2026

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    toc-title: "On this page"
    code-fold: false
    code-copy: true
    code-tools: false
    number-sections: false
    smooth-scroll: false
    grid:
      sidebar-width: 260px
      body-width: 780px
      margin-width: 220px
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

execute:
  freeze: auto
